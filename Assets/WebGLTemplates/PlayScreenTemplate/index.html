<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <!-- 🚨 1. 카카오톡 인앱 브라우저 강제 탈출 (외부 브라우저 호출) -->
    <script>
      var userAgent = navigator.userAgent.toLowerCase();
      if (userAgent.indexOf('kakaotalk') > -1) {
          var currentUrl = encodeURIComponent(location.href);
          location.href = 'kakaotalk://web/openExternal?url=' + currentUrl;
      }
    </script>

    <!-- 반응형 꽉 찬 화면을 위한 CSS -->
    <style>
      /* 브라우저 기본 여백을 없애고 뒷배경을 어둡게 처리 */
      body {
        margin: 0;
        padding: 0;
        background-color: #231F20; 
        overflow: hidden; 
      }

      /* 게임을 감싸는 뼈대: PC에서는 1280x720 16:9 비율 고정, 모바일에서는 꽉 차게 */
      #unity-container {
        width: 100vw;
        height: 100vh;
        max-width: 1280px;      
        max-height: 720px;      
        aspect-ratio: 16 / 9;   
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #000000;
      }

      /* 실제 렌더링 도화지: 뼈대 영역에 찌그러짐 없이 꽉 채움 */
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
      }

      /* 하단 전체화면 버튼 등 불필요한 유니티 기본 푸터 숨김 처리 */
      #unity-footer { display: none; }
    </style>
  </head>
  <body>
   <div id="unity-container">
      <!-- 유니티 매크로: 초기 해상도 변수가 주입됩니다 -->
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // 유니티 템플릿 매크로 변수 적용 (빌드 시 자동 치환됨)
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
      };

      // 모바일용 뷰포트 강제 설정
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
